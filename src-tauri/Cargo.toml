[package]
name = "t2screenshot"
version = "0.1.0"
description = "A cross-platform screenshot tool built with Tauri 2"
authors = ["you"]
edition = "2021"

[lib]
name = "t2screenshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
xcap = "0.7"
image = "0.25"
base64 = "0.22"
dirs = "6"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

